; ============================================================================
; إعدادات PHP داخل حاوية Docker
; ============================================================================

; الأخطاء: لا تُعرض للزوار، وتُسجَّل في ملف
display_errors = Off
log_errors = On

; رفع الملفات (صور السيارات وغيرها)
file_uploads = On
upload_max_filesize = 8M
post_max_size = 10M
max_execution_time = 120
memory_limit = 256M

; المنطقة الزمنية (يمكن تعديلها)
date.timezone = Africa/Casablanca

; الجلسات
session.cookie_httponly = 1
session.use_strict_mode = 1
session.gc_maxlifetime = 86400
